# ─────────────────────────────────────────────────────────────────────────
# AppointMe — backing services ONLY, for local development.
#
# This file mirrors what `dotnet run --project src/AppointMe.Aspire` brings up
# (same images, same host ports, same dev credentials), for when you'd rather
# run the API and the SPA yourself:
#
#     # one-time: trust the ASP.NET dev cert and export it for Keycloak
#     bash docker/keycloak/export-dev-cert.sh
#
#     podman compose up -d        # or: docker compose up -d / podman-compose up -d
#     dotnet run --project src/AppointMe.Api        # API → https://localhost:7233
#     cd src/AppointMe.Frontend && yarn dev         # SPA → https://localhost:5173
#
# For the full everything-in-containers deployment (Fedora server + Cloudflare
# Tunnel), see deploy/compose.yaml instead.
#
# What the API on the host expects (appsettings.Development.json):
#   SQL Server  →  localhost,60740   sa / Password1
#   Keycloak    →  https://localhost:8082   (admin console: admin / admin)
#   Mailpit UI  →  http://localhost:8026    (SMTP on localhost:1026)
#
# Fedora / SELinux note: unlike deploy/compose.yaml (zero bind mounts), this
# file DOES bind-mount two things into Keycloak — the dev TLS certificate and
# the realm export. On Fedora, SELinux blocks containers from reading host
# files unless the mount is relabelled, so both mounts carry `:Z` ("private to
# this one container"). The named data volumes need no label — Podman handles
# those automatically. `:U` on the data volumes fixes file OWNERSHIP for
# rootless runs (chowns to the in-container UID); it is unrelated to SELinux.
# ─────────────────────────────────────────────────────────────────────────
name: appointme-dev

services:

  # ── Database ──────────────────────────────────────────────────────────
  # Dev credentials are deliberately committed: they match
  # appsettings.Development.json and the Aspire host (sa / Password1).
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-CU1-ubuntu-24.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Password1"
      MSSQL_PID: "Developer"
    ports:
      - "60740:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql:U
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  # ── Identity provider ─────────────────────────────────────────────────
  # Serves HTTPS on https://localhost:8082 using the exported ASP.NET dev
  # certificate (run docker/keycloak/export-dev-cert.sh once first — Keycloak
  # exits at startup if the cert files are missing). The realm export is
  # imported on first boot; the H2 data dir is persisted so dev accounts
  # survive restarts.
  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "admin"
      KC_HEALTH_ENABLED: "true"
      KC_HTTPS_CERTIFICATE_FILE: "/opt/keycloak/conf/certs/keycloak.crt"
      KC_HTTPS_CERTIFICATE_KEY_FILE: "/opt/keycloak/conf/certs/keycloak.key"
    ports:
      # Host 8082 → Keycloak's HTTPS port. The API's dev Authority is
      # https://localhost:8082/realms/appointme.
      - "8082:8443"
    volumes:
      # Named volume first (parent path), file bind-mount second (child path):
      # the runtime mounts child paths after parents, so the realm file stays
      # visible inside the persisted data directory.
      - keycloak-data:/opt/keycloak/data:U
      - ./src/AppointMe.Aspire/appointme-realm.json:/opt/keycloak/data/import/appointme-realm.json:ro,Z
      - ./docker/keycloak/certs:/opt/keycloak/conf/certs:ro,Z
    healthcheck:
      # TCP probe of the management port (no curl/wget in the image; a bare
      # connect works whether the management interface is HTTP or HTTPS).
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # ── Mail catcher ──────────────────────────────────────────────────────
  # Sign-up sends a "verify your email & set your password" link; read it at
  # http://localhost:8026. The realm's SMTP host is literally "Mailpit", so
  # that name is exposed as a network alias for Keycloak to resolve.
  mailpit:
    image: docker.io/axllent/mailpit:latest
    networks:
      default:
        aliases:
          - Mailpit
    ports:
      - "8026:8025"   # web UI
      - "1026:1025"   # SMTP (matches the Aspire host's published port)
    restart: unless-stopped

volumes:
  sqlserver-data:
  keycloak-data:
